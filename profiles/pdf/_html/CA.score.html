/* Print profile in the manner of the 2026 US Talent Report. Cover and By the Numbers are fixed
   full-bleed warm-grey pages (named page "full", no margins); everything else flows on white pages
   with margins, and every figure, table and heading-with-lead is unbreakable. */
@page { size: 8.5in 11in; margin: 1.12in 1.12in 0.85in 1.17in }
@page full { margin: 0 }
:root {
  --crim: #9a0033; --crim-d: #6e0024; --ink: #111111; --body: #1c1c1c; --taupe: #8a7f72; --muted: #6f6a64;
  --paper: #e2e0dc; --panel: #ffffff; --pink: #f4d7dc; --band: #f5f2ed; --rule: #e6e2dc;
  --teal: #23707f; --orange: #f39a32; --green: #76a13a; --purple: #6b2a73; --brown: #6e3b23; --grey: #b9b3aa; --rose: #d9718a; --navy: #2b3f73;
  --up: #1d3fd0; --down: #f2c200;
}
* { box-sizing: border-box }
html, body { margin: 0; background: #fff; color: var(--body) }
body { font-family: 'EB Garamond', Garamond, 'Times New Roman', serif; font-size: 11.4pt; line-height: 1.42; -webkit-print-color-adjust: exact; print-color-adjust: exact }
.full { page: full; width: 8.5in; height: 11in; position: relative; overflow: hidden; background: var(--paper); break-after: page }
.full .inner { position: absolute; left: 1.17in; right: 1.12in; top: 1.45in; bottom: 0.8in }

/* cover */
.cover-band { position: absolute; left: 0; right: 0; top: 0; height: 4.3in; color: #fff;
  background: radial-gradient(ellipse 70% 90% at 18% 105%, #b30d17 0%, rgba(150,8,16,.85) 30%, rgba(40,0,4,0) 70%),
              radial-gradient(ellipse 60% 70% at 92% 40%, rgba(170,10,20,.75) 0%, rgba(60,0,6,0) 65%), #070000 }
.cover-band .in { position: absolute; left: 1.17in; right: 1.12in; top: 0.95in }
.kicker { font: 800 8.5pt Montserrat, sans-serif }
.cover-band h1 { margin: .22in 0 0; font: 800 54pt/1 Montserrat, sans-serif; letter-spacing: -.012em }
.cover-band .bar { width: 4.1in; height: 2px; background: #b0123c; margin: .2in 0 .16in }
.cover-band h2 { margin: 0; font: 600 17pt/1.25 Montserrat, sans-serif }
.cover-band h3 { margin: .04in 0 0; font: 300 15pt/1.3 Montserrat, sans-serif; color: #b9a9a4; max-width: 3.9in }
.cover-meta { position: absolute; right: 1.12in; top: 0.95in; text-align: right; font: 800 8.5pt Montserrat, sans-serif; letter-spacing: .08em }
.lede { font-size: 12pt; line-height: 1.42; margin: 0 0 .16in; color: var(--ink) }
.kt-h { font: 800 25pt/1 Montserrat, sans-serif; color: var(--ink) }
.kt-rule { width: 2.2in; height: 2px; background: var(--crim); margin: .12in 0 .2in }
ol.kt { list-style: none; margin: 0; padding: 0; position: relative }
ol.kt::before { content: ""; position: absolute; left: .17in; top: .1in; bottom: .1in; width: 3px; background: var(--crim) }
ol.kt li { position: relative; padding-left: .62in; margin-bottom: .1in; font: 400 9pt/1.45 Montserrat, sans-serif; color: var(--ink) }
ol.kt li .n { position: absolute; left: 0; top: -.02in; width: .37in; height: .37in; border-radius: 50%; background: var(--crim); color: #fff; font: 800 15pt/.37in Montserrat, sans-serif; text-align: center }
ol.kt li b { font-weight: 700 }

/* by the numbers */
h2.title { font: 800 21pt/1.1 Montserrat, sans-serif; color: var(--ink); margin: 0 0 .14in }
.btn-panel { background: var(--panel); padding: .16in .22in .12in; margin: 0 -.22in }
table.btn { width: 100%; border-collapse: collapse; font: 400 7.7pt Montserrat, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums }
table.btn th { font: 500 6.8pt Montserrat, sans-serif; text-align: left; padding: 3px 5px; border-bottom: 2px solid var(--crim-d) }
table.btn th.h { background: #8a8076; color: #fff; font-weight: 700; text-align: center }
table.btn td { padding: 1.9px 5px; border-bottom: 1px solid #ece8e2; line-height: 1.3 }
table.btn td.num { text-align: right; white-space: nowrap }
table.btn td.hl { background: var(--pink); color: var(--crim); font-weight: 800; text-align: center; white-space: nowrap }
table.btn td.chg { text-align: right; white-space: nowrap }
table.btn td.arr { width: 12px; text-align: center; font-size: 7.4pt }
table.btn td.rk { text-align: right; color: var(--muted); font-size: 7pt; white-space: nowrap }
table.btn tr.s td { background: var(--band); color: var(--crim); font: 800 7.3pt Montserrat, sans-serif; border-top: 1px solid #222; padding-top: 3px }
sup { font-size: 5.4pt; line-height: 0 }
.tnote { font: 400 6.6pt/1.45 Montserrat, sans-serif; color: var(--ink); margin-top: .08in }
.tnote b { font-weight: 700 }

/* flowing chapters (white pages) */
.chap { break-before: page }
.chap-h { break-inside: avoid; margin-bottom: .08in }
.chap-h .num { font: 800 8.5pt Montserrat, sans-serif; color: var(--crim); letter-spacing: .04em; text-transform: uppercase }
.chap-h h2 { font: 300 25pt/1.12 Montserrat, sans-serif; color: var(--taupe); margin: .04in 0 .14in }
.chap-h .rule { width: 1.6in; height: 2px; background: var(--crim); margin: 0 0 .16in }
p { margin: 0 0 .11in; orphans: 3; widows: 3 }
.fig { margin: .12in 0 .2in; break-inside: avoid; page-break-inside: avoid }
.fig .ft { font: 700 10.6pt/1.25 Montserrat, sans-serif; color: var(--ink); margin: 0 0 .07in }
.fig .ft em { font-style: normal; color: var(--crim) }
.fig svg { display: block; width: 100%; overflow: visible }
.fig svg text { font-family: Montserrat, sans-serif; font-size: 7.2px; fill: #5d5953 }
.fig .fs { font: 400 6.5pt/1.4 Montserrat, sans-serif; color: var(--muted); margin-top: .05in }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: .26in; break-inside: avoid; page-break-inside: avoid }
.duo > .fig { margin: .12in 0 .2in }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font: 500 7pt Montserrat, sans-serif; color: var(--ink); margin: 0 0 4px }
.legend i { display: inline-block; width: 14px; height: 3px; margin-right: 5px; vertical-align: middle }
.legend i.dash { height: 0; border-top: 2px dashed currentColor; background: none !important }
.legend i.dot { width: 8px; height: 8px; border-radius: 50% }
.legend i.ring { width: 8px; height: 8px; border-radius: 50%; background: none !important; border: 2px solid var(--teal) }
.legend i.sq { width: 9px; height: 9px }
table.dt { width: 100%; border-collapse: collapse; font: 400 7.5pt Montserrat, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums }
table.dt th { font: 500 6.7pt Montserrat, sans-serif; text-align: right; padding: 3px 5px; border-bottom: 2px solid var(--crim-d); vertical-align: bottom }
table.dt th:first-child, table.dt td:first-child { text-align: left }
table.dt th.focus { color: var(--crim); font-weight: 800 }
table.dt td { padding: 2.4px 5px; text-align: right; border-bottom: 1px solid var(--rule) }
table.dt td.focus { background: var(--pink); color: var(--crim); font-weight: 800 }
table.dt td small { display: block; color: var(--muted); font-size: 6pt }
.fig svg text { font-size: 7.9px }
/* headline stat row (all variants) */
.stats { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: .16in; margin: .04in 0 .18in; break-inside: avoid }
.stat .v { font: 800 22pt/1 Montserrat, sans-serif; color: var(--crim); letter-spacing: -.01em }
.stat .l { font: 600 7.6pt/1.3 Montserrat, sans-serif; color: var(--ink); margin-top: .05in }
.stat .c { font: 400 6.9pt/1.35 Montserrat, sans-serif; color: var(--muted); margin-top: .03in }
.stat .c b { color: var(--ink); font-weight: 700 }
/* cover locator map */
.loc { position: absolute; right: 1.12in; bottom: .42in; display: grid; grid-template-columns: repeat(12, 13px); grid-auto-rows: 13px; gap: 2px }
.loc i { display: block; background: rgba(255,255,255,.16); border-radius: 1px }
.loc i.me { background: #fff }
/* A: report chapters — full-bleed dark opener page per section */
.v-report .opener { page: full; width: 8.5in; height: 11in; position: relative; overflow: hidden; break-after: page; color: #fff;
  background: radial-gradient(ellipse 75% 60% at 15% 100%, #b30d17 0%, rgba(150,8,16,.8) 32%, rgba(40,0,4,0) 72%), radial-gradient(ellipse 55% 55% at 95% 25%, rgba(160,10,20,.6) 0%, rgba(60,0,6,0) 65%), #070000 }
.v-report .opener .in { position: absolute; left: 1.17in; right: 1.12in; top: 1.3in }
.v-report .opener .num { font: 800 9pt Montserrat, sans-serif; letter-spacing: .02em }
.v-report .opener h2 { font: 800 46pt/1.02 Montserrat, sans-serif; margin: .14in 0 .18in; text-wrap: balance }
.v-report .opener .rule { width: 3.6in; height: 2px; background: #b0123c; margin: 0 0 .3in }
.v-report .opener .stats { margin-top: .3in }
.v-report .opener .stat .v { color: #fff; font-size: 28pt } .v-report .opener .stat .l { color: #fff } .v-report .opener .stat .c, .v-report .opener .stat .c b { color: #c9b7b2 }
.v-report .opener p { color: #e9dedb; font-size: 12.2pt; line-height: 1.5 }
.v-report .chap { break-before: auto }
/* B: margin brief — stat rail in the left margin, figures span the full measure */
.v-brief .chap { padding-left: 1.72in }
.v-brief .chap-h h2 { margin-left: -1.72in }
.v-brief .chap-h .num, .v-brief .chap-h .rule { margin-left: -1.72in }
.v-brief .rail { float: left; width: 1.46in; margin-left: -1.72in; border-top: 2px solid var(--crim); padding-top: .08in }
.v-brief .rail .stats { grid-template-columns: 1fr; gap: .14in }
.v-brief .rail .stat .v { font-size: 18pt }
.v-brief .fig, .v-brief .duo { margin-left: -1.72in }
.v-brief .chap-h p { font-size: 11.6pt }
/* C: scorecard — boxed tiles, sans body, dense */
.v-score body, .v-score { }
.v-score .chap p { font: 400 8.8pt/1.55 Montserrat, sans-serif }
.v-score .chap-h h2 { font: 800 20pt/1.1 Montserrat, sans-serif; color: var(--ink) }
.v-score .stats { gap: .1in }
.v-score .stat { background: var(--band); border-top: 3px solid var(--crim); padding: .1in .12in .1in }
.v-score .stat .v { font-size: 19pt }
.v-score .stat .rk { float: right; font: 800 7pt Montserrat, sans-serif; color: #fff; background: var(--crim); border-radius: 9px; padding: 2px 6px }
.v-score .fig .ft { font-size: 9.6pt; text-transform: none }
.notes { font: 400 7pt/1.5 Montserrat, sans-serif; color: var(--ink) }
.notes h4 { font: 800 8pt Montserrat, sans-serif; margin: .14in 0 .04in; color: var(--crim) }
.notes p { margin: 0 0 .06in }
</style>

(() => { const fl = M.flows, nr = row("net_migration_ft");
  chapter("Student Migration", `<p>In fall ${M.year}, ${nf(M.stay)} ${esc(NAME)} residents began college at institutions in the state, ${nf(domIn)} first-time students arrived from other states, ${nf(abroadN)} arrived from abroad, and ${nf(M.out_total)} residents left to enroll elsewhere. ${pct(ins.v1)} of the state's first-time students are residents (${rk("instate_share_ft")}; U.S. ${pct(ins.us1)}).</p>
    <p>Net migration was ${fmtSpec(nr.v1, nr.fmt, nr.unit)} per 100 resident first-time students (${rk("net_migration_ft")}). The largest sources of arriving students were ${M.in.filter(x => x.k !== "Abroad").slice(0, 3).map(x => `${x.name} (${nf(x.n)})`).join(", ")}; the largest destinations for departing residents were ${M.out.slice(0, 3).map(x => `${x.name} (${nf(x.n)})`).join(", ")}.</p>`,
    fig(`Where Do ${esc(NAME)}'s First-Time Students Come From, and Where Do Its Residents Go?`, sankeySVG(), `First-time degree-seeking undergraduates, fall ${M.year}, by home (left) and state of the institution entered (right). IPEDS records students from abroad as one category, not by country. ${SRC} Fall Enrollment.`) +
    fig(`How Have ${esc(NAME)}'s Student Flows Changed?`, legendHTML(fl.k.map((k, i) => ({n: k, c: PAL[i]}))) + lineSVG({series: multi(fl), unit: "n", right: 120}), `First-time students by flow; even years before 2001; odd years with incomplete reporting are omitted. ${SRC} Fall Enrollment.`) +
    fig(`Which States Exchange the Most Students With ${esc(NAME)}?`, `<table class="dt"><tr><th>Arrived from</th><th>Students</th><th>Left for</th><th>Students</th></tr>${Array.from({length: Math.max(M.in.length, M.out.length)}, (_, i) => `<tr><td>${esc(M.in[i] ? M.in[i].name : "")}</td><td>${M.in[i] ? nf(M.in[i].n) : ""}</td><td style="text-align:left">${esc(M.out[i] ? M.out[i].name : "")}</td><td>${M.out[i] ? nf(M.out[i].n) : ""}</td></tr>`).join("")}</table>`, `First-time degree-seeking undergraduates, fall ${M.year}. ${SRC}.`, {table: true})); })();

/* ---------------- 11 Competitors ---------------- */
(() => { const cols = [ST, ...PEERS, "US"], pl = D.peer_lines;
  const pser = (m, abbr) => cols.map((s, i) => ({name: s === "US" ? "United States" : NM[s], short: abbr ? (s === "US" ? "U.S." : s) : undefined, s: pl[m][s], c: s === ST ? CRIM : s === "US" ? TAUPE : PEERC[i - 1], w: s === ST ? 2.4 : 1.3, dash: s === "US", bold: s === ST}));
  const leg = legendHTML([ST, ...PEERS].map((s, i) => ({n: NM[s], c: s === ST ? CRIM : PEERC[i - 1]})).concat([{n: "United States", c: TAUPE, kind: "dash"}]));
  chapter("Competitors", `<p>The four states closest to ${esc(NAME)} in total fall enrollment are ${PEERS.map(s => esc(NM[s])).join(", ")}. Among them, ${esc(NAME)} ranks ${ord(peerOrder.indexOf(ST) + 1)} on the international share of STEM master's; ${esc(NM[peerOrder[0]])} is the most dependent at ${pct(pSM.vals[peerOrder[0]])}.</p>
    <p>The table compares the five states on enrollment, STEM output, international dependence, completion, prices and migration. The interactive profile offers other peer sets, including region, economy size, output per person, 2024 presidential vote and student exchange.</p>`,
    fig(`How Dependent Are ${esc(NAME)} and Its Peers on International STEM Master's Graduates?`, leg + lineSVG({series: pser("intl_share_stem_master"), right: 116}), `International share of STEM master's degrees. ${SRC} Completions, 1995–${lastY(pl.intl_share_stem_master[ST])}.`) +
    duo(fig("International Share of Graduate Enrollment", lineSVG({series: pser("intl_share_enroll_grad", true), W: HALF, H: 170, right: 50}), `${SRC} Fall Enrollment.`),
        fig("Six-Year Graduation Rate", lineSVG({series: pser("grad_rate_bach6", true), W: HALF, H: 170, right: 50, zero: false}), `${SRC} Graduation Rates.`)) +
    fig(`How Does ${esc(NAME)} Compare With States of Similar Size?`, `<table class="dt"><tr><th>Measure</th>${cols.map(s => `<th class="${s === ST ? "focus" : ""}">${s === "US" ? "U.S." : esc(NM[s])}</th>`).join("")}</tr>${D.peer_tab.map(r => `<tr><td>${esc(r.title)} <span style="color:var(--muted)">${r.y || ""}</span></td>${cols.map(s => `<td class="${s === ST ? "focus" : ""}">${fmtSpec(r.vals[s], r.fmt, r.unit)}${s !== "US" && r.ranks[s] ? `<small>#${r.ranks[s]}</small>` : ""}</td>`).join("")}</tr>`).join("")}</table>`, `Small figures are ranks among the 50 states and DC (1 = highest). Dollar values in 2024 dollars. ${SRC}.`, {table: true})); })();

/* ---------------- 12 Institutions ---------------- */
(() => { const ti = P.inst.top_intl.filter(r => (r.ms_stem_intl || 0) + (r.phd_stem_intl || 0) > 0), te = P.inst.top_enroll, yrs = P.inst.years;
  const sh = (a, b) => b ? pct(100 * a / b) : "–";
  chapter("Institutions in Detail", `<p>${esc(NAME)} has ${nf(P.inst.n)} degree-granting institutions in the IPEDS universe. The tables list those that train the most international STEM graduates and the ${te.length} largest by enrollment, with their international shares, STEM output, completion and selectivity.</p>`,
    (ti.length ? fig(`Which ${esc(NAME)} Institutions Train the Most International STEM Graduates?`, `<table class="dt"><tr><th>Institution</th><th>Intl STEM master's</th><th>Intl share</th><th>Intl STEM doctorates</th><th>Intl share</th><th>Intl share of grad students</th></tr>${ti.map(r => `<tr><td>${esc(r.name)}<small>${esc(r.city || "")} · ${esc(r.sector || "")}</small></td><td class="focus">${nf(r.ms_stem_intl)}</td><td>${sh(r.ms_stem_intl, r.ms_stem)}</td><td>${nf(r.phd_stem_intl)}</td><td>${sh(r.phd_stem_intl, r.phd_stem)}</td><td>${pct(r.intl_grad)}</td></tr>`).join("")}</table>`, `Degrees awarded in ${yrs.completions}; enrollment shares from fall ${yrs.enroll}. ${SRC}.`, {table: true}) : "") +
    fig(`What Are ${esc(NAME)}'s Largest Institutions?`, `<table class="dt"><tr><th>Institution</th><th>Enrollment</th><th>Intl share, grad</th><th>Intl share, undergrad</th><th>STEM bachelor's</th><th>Six-year grad rate</th><th>Admit rate</th></tr>${te.map(r => `<tr><td>${esc(r.name)}<small>${esc(r.city || "")} · ${esc(r.sector || "")}</small></td><td class="focus">${nf(r.enroll)}</td><td>${pct(r.intl_grad)}</td><td>${pct(r.intl_ug)}</td><td>${nf(r.ba_stem)}</td><td>${pct(r.grad6)}</td><td>${r.admit != null ? pct(r.admit) : "–"}</td></tr>`).join("")}</table>`, `Fall ${yrs.enroll} enrollment; degrees ${yrs.completions}; graduation rates ${yrs.grad}; admissions ${yrs.admissions}. ${SRC}.`, {table: true})); })();

/* ---------------- notes ---------------- */
SECTION_TITLES.push("About These Data");
doc.insertAdjacentHTML("beforeend", `<section class="chap"><div class="chap-h"><div class="num">Notes</div><h2>About These Data</h2><div class="rule"></div></div><div class="notes">
  <h4>International students</h4><p>U.S. nonresidents (students on temporary visas), as IPEDS defines them. IPEDS does not record country of citizenship, so this profile shows where international students enroll and graduate, not where they come from. Permanent residents are counted with U.S. citizens.</p>
  <h4>STEM</h4><p>CIP families 03, 04, 11, 14, 15, 26, 27 and 40. Doctorates are research and scholarship doctorates; professional doctorates appear only in the degree-count figure. Degrees are first majors only.</p>
  <h4>Universe</h4><p>Degree-granting institutions located in the state; Title IV participants from 1996. Geography is the institution's location, not the student's home. Enrollment is fall headcount.</p>
  <h4>Migration</h4><p>First-time degree-seeking undergraduates by home state, reported in even years before 2001 and every year since; odd years with incomplete reporting are omitted. Net migration is students arriving from other states minus residents leaving, per 100 resident first-time students.</p>
  <h4>Money</h4><p>All dollar values are in 2024 dollars using the CPI-U. Appropriations and revenue are per full-time-equivalent student at public institutions.</p>
  <h4>Race and ethnicity</h4><p>IPEDS did not collect race and ethnicity in every year before 2010, and categories changed in 2008–2010; “Two or more” exists only from then.</p>
  ${P.online ? `<h4>Caveat for ${esc(NAME)}</h4><p>${esc(P.online)}</p>` : ""}
  <h4>Peers</h4><p>Comparison states are the four closest in total fall enrollment.</p>
  <h4>Source</h4><p>National Center for Education Statistics, Integrated Postsecondary Education Data System (IPEDS): Institutional Characteristics, Fall Enrollment, Completions, Graduation Rates, Finance, Human Resources and Admissions components, 1980–2025, harmonized into a state panel. Generated ${esc(D.built)}.</p></div></section>`);

window.__titles = SECTION_TITLES;
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body>
</html>
