[project]
name = "ipeds-longitudinal"
version = "0.1.0"
description = "Cleaning pipeline for decennial IPEDS/HEGIS extracts (1980-2020)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "python-calamine>=0.2",
    "brotli>=1.1",
    "pdfplumber>=0.11",     # tables from PDF-only sources (DHS yearbooks, SEVIS reports, Open Doors, NAFSA)          # fontTools needs it to read the woff2 fonts (static PDF font instances)
]
